name: CI

on:
  push:
    branches: [main, "develop/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run verify

  web-runtime:
    name: Godot Web runtime replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Run Web target
        run: node bin/talarion.mjs test web --json

      - name: Upload Web evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talarion-web-evidence
          path: artifacts/run/web
          if-no-files-found: error

  android-runtime:
    name: Godot Android emulator replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${ANDROID_SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK}" >> "$GITHUB_ENV"

          SDKMANAGER="${ANDROID_SDK}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "build-tools;35.0.1"             "platforms;android-35"

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Android Debug,O=Android,C=US"               -keyalg RSA               -keysize 2048               -validity 10000
          fi

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android target in emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-save -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb shell wm dismiss-keyguard || true
            node bin/talarion.mjs test android --json

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talarion-android-evidence
          path: artifacts/run/android
          if-no-files-found: error

  runtime-parity:
    name: Web Android state parity
    needs: [web-runtime, android-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download Web evidence
        uses: actions/download-artifact@v4
        with:
          name: talarion-web-evidence
          path: .evidence/web

      - name: Download Android evidence
        uses: actions/download-artifact@v4
        with:
          name: talarion-android-evidence
          path: .evidence/android

      - name: Compare runtime state
        run: |
          node bin/talarion.mjs compare             .evidence/web/state.jsonl             .evidence/android/state.jsonl             --json

      - name: Compare visual checkpoints
        run: |
          node bin/talarion.mjs visual compare .evidence/web .evidence/android artifacts/parity/visual --json

      - name: Generate parity report
        if: always()
        run: |
          node bin/talarion.mjs report             .evidence/web/state.jsonl             .evidence/android/state.jsonl             artifacts/parity/runtime-parity.html             artifacts/parity/visual/result.json             .evidence/web/runner-result.json             .evidence/android/runner-result.json

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talarion-runtime-parity
          path: artifacts/parity/
          if-no-files-found: error
