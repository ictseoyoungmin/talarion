name: CI

on:
  push:
    branches: [main, "develop/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run verify
      - name: Export deterministic Doctor report
        run: node bin/talarion.mjs doctor report artifacts/doctor --json

      - name: Upload Doctor report
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: talarion-doctor-report
          path: artifacts/doctor/
          if-no-files-found: error

  web-runtime:
    name: Godot Web runtime replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Run Web target
        run: node bin/talarion.mjs test web --json

      - name: Upload Web evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talarion-web-evidence
          path: artifacts/run/web
          if-no-files-found: error

  android-runtime:
    name: Godot Android emulator replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${ANDROID_SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK}" >> "$GITHUB_ENV"

          SDKMANAGER="${ANDROID_SDK}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "build-tools;35.0.1"             "platforms;android-35"

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Android Debug,O=Android,C=US"               -keyalg RSA               -keysize 2048               -validity 10000
          fi

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android target in emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-save -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb shell wm dismiss-keyguard || true
            # Android emulator runner executes each script line independently.
            # Verify service readiness in one shell, not by replay retries.
            sh -c 'ready=0; for attempt in $(seq 1 45); do if adb shell am get-current-user >/dev/null 2>&1 && adb shell pm path android >/dev/null 2>&1; then ready=1; break; fi; sleep 2; done; if [ "$ready" -ne 1 ]; then echo "Android ActivityManager/PackageManager never became ready" >&2; exit 1; fi'
            node bin/talarion.mjs test android --json

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talarion-android-evidence
          path: artifacts/run/android
          if-no-files-found: error

  runtime-parity:
    name: Web Android state parity
    needs: [web-runtime, android-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download Web evidence
        uses: actions/download-artifact@v4
        with:
          name: talarion-web-evidence
          path: .evidence/web

      - name: Download Android evidence
        uses: actions/download-artifact@v4
        with:
          name: talarion-android-evidence
          path: .evidence/android

      - name: Compare runtime state
        run: |
          node bin/talarion.mjs compare             .evidence/web/state.jsonl             .evidence/android/state.jsonl             --json

      - name: Compare visual checkpoints
        run: |
          node bin/talarion.mjs visual compare .evidence/web .evidence/android artifacts/parity/visual --json

      - name: TL00 acceptance gate
        run: |
          node bin/talarion.mjs gate tl00 .evidence/web .evidence/android artifacts/parity/visual/result.json artifacts/parity/tl00-acceptance.json --json

      - name: TL02 observed evidence and budget profile coverage
        run: |
          node bin/talarion.mjs budget authority .evidence/web .evidence/android artifacts/parity/performance-authority.json --json
          node --input-type=module -e 'import fs from "node:fs"; const x=JSON.parse(fs.readFileSync("artifacts/parity/performance-authority.json")); if(!x.ok||x.targets.some(t=>!t.budgetCoverage?.ok||t.budgetCoverage.metrics.some(m=>m.comparisonEvaluated||m.decision!=="not-evaluated")||t.performanceWindow?.status!=="complete-window"||!t.performanceWindow.metrics||t.performanceWindow.budgetDecision!=="not-evaluated")||x.certification.physicalDevice) process.exit(1);'

      - name: TL02-P3 evidence-only performance report
        run: |
          node bin/talarion.mjs budget report current artifacts/parity/performance-authority.json artifacts/parity/performance-review --json
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("artifacts/parity/performance-review/performance-review.json")); if(!r.ok||r.decision!=="evidence-only"||r.hardwareCertified||r.performanceCertified||r.targets.length!==2||r.targets.some(t=>!t.evidenceValid||t.candidateCount!==1||t.baselineCount!==0||t.regression.status!=="not-evaluated"))process.exit(1);'

      - name: Generate parity report
        if: always()
        run: |
          node bin/talarion.mjs report             .evidence/web/state.jsonl             .evidence/android/state.jsonl             artifacts/parity/runtime-parity.html             artifacts/parity/visual/result.json             .evidence/web/runner-result.json             .evidence/android/runner-result.json

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talarion-runtime-parity
          path: artifacts/parity/
          if-no-files-found: error

  web-native-runtime:
    name: Web-native Three.js browser replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Three.js and Playwright
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Inspect independent Web-native source
        run: node bin/talarion.mjs web-native inspect examples/web-native --json
      - name: Run original Three.js game in Chromium
        run: node bin/talarion.mjs web-native test examples/web-native --json
      - name: Upload game-specific runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talarion-web-native-evidence
          path: artifacts/run/web-native/
          if-no-files-found: error

  android-webview-runtime:
    name: Web-native Android WebView APK replay and parity
    needs: [web-native-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Web game dependencies
        run: npm install
      - name: Configure Android SDK for Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${ANDROID_SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK}" >> "$GITHUB_ENV"
          SDKMANAGER="${ANDROID_SDK}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
      - name: Download verified original Web-native evidence
        uses: actions/download-artifact@v4
        with:
          name: talarion-web-native-evidence
          path: .evidence/wf01-browser
      - name: WebView packaging plan (source only)
        run: node bin/talarion.mjs web-native android plan examples/web-native --json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and replay Android WebView Debug APK
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-save -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb shell wm dismiss-keyguard || true
            sh -c 'ready=0; for attempt in $(seq 1 45); do if adb shell am get-current-user >/dev/null 2>&1 && adb shell pm path android >/dev/null 2>&1; then ready=1; break; fi; sleep 2; done; if [ "$ready" -ne 1 ]; then echo "Android services never became ready" >&2; exit 1; fi'
            node bin/talarion.mjs web-native android test examples/web-native --json
            node bin/talarion.mjs web-native android smoke examples/web-native --json
      - name: Compare independently recorded browser and WebView game state
        run: |
          node --input-type=module -e 'import {compareWebAndWebView} from "./src/android-webview/parity.mjs"; const r=await compareWebAndWebView(".evidence/wf01-browser","artifacts/run/android-webview","artifacts/parity/wf02/webview-parity.json");console.log(r.text);if(!r.ok)process.exit(1)'
      - name: Upload real WebView Android APK, screenshots and parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talarion-webview-debug-apk-and-evidence
          path: |
            artifacts/build/android-webview/
            artifacts/run/android-webview/
            artifacts/run/android-webview-interactive/
            artifacts/parity/wf02/
          if-no-files-found: error

  android-release-aab:
    name: WF03 signed API36 AAB, Release emulator runtime and parity
    needs: [web-native-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned game dependencies
        run: npm install
      - name: Install API36 SDK and pinned bundletool
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          BUNDLETOOL="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" \
            --output "$BUNDLETOOL"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $BUNDLETOOL" | sha256sum --check --status
          echo "TALARION_BUNDLETOOL_JAR=$BUNDLETOOL" >> "$GITHUB_ENV"
      - name: Create isolated disposable CI signer (not production upload key)
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/talarion-wf03-signing"
          mkdir -p "$KEY_DIR"
          umask 077
          openssl rand -hex 32 > "$KEY_DIR/pass.txt"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$KEY_DIR/ci-upload.p12" \
            -storepass "$(cat "$KEY_DIR/pass.txt")" \
            -keypass "$(cat "$KEY_DIR/pass.txt")" \
            -alias "wf03ciupload" -dname "CN=WF03 CI Disposable Key,O=Talarion" \
            -keyalg RSA -keysize 3072 -validity 90
          echo "TALARION_RELEASE_KEYSTORE=$KEY_DIR/ci-upload.p12" >> "$GITHUB_ENV"
          echo "TALARION_RELEASE_ALIAS=wf03ciupload" >> "$GITHUB_ENV"
          echo "TALARION_RELEASE_STOREPASS_FILE=$KEY_DIR/pass.txt" >> "$GITHUB_ENV"
          echo "TALARION_RELEASE_KEYPASS_FILE=$KEY_DIR/pass.txt" >> "$GITHUB_ENV"
      - name: Build API36 AAB with original Three.js source
        run: |
          node bin/talarion.mjs web-native android release plan examples/web-native --json
          node bin/talarion.mjs web-native android release build examples/web-native --json
          node bin/talarion.mjs web-native android release verify examples/web-native --json
      - name: Verify evidence never claims Play certification
        run: |
          node --input-type=module -e 'import fs from "node:fs";const r=JSON.parse(fs.readFileSync("artifacts/build/android-webview-release/release-evidence.json"));if(!r.ok||r.targetSdk!==36||r.playApproved||r.releaseCertified||r.deviceInstallObserved||!r.gate.signatureVerified||!r.gate.bundletoolValidated)process.exit(1)'
      - name: Download independently observed WF01 original browser evidence
        uses: actions/download-artifact@v4
        with:
          name: talarion-web-native-evidence
          path: .evidence/wf03-browser
      - name: Enable KVM for actual Release APK emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Extract original signed AAB and exercise Release gameplay, trusted touch and HOME lifecycle
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-save -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb shell wm dismiss-keyguard || true
            sh -c 'ready=0; for attempt in $(seq 1 45); do if adb shell am get-current-user >/dev/null 2>&1 && adb shell pm path android >/dev/null 2>&1; then ready=1; break; fi; sleep 2; done; if [ "$ready" -ne 1 ]; then echo "Android services never became ready" >&2; exit 1; fi'
            node bin/talarion.mjs web-native android release test examples/web-native --json
      - name: Compare actual extracted Release APK game against independent browser replay
        run: |
          node --input-type=module -e 'import {compareWebAndWebView} from "./src/android-webview/parity.mjs"; const r=await compareWebAndWebView(".evidence/wf03-browser","artifacts/run/android-webview-release","artifacts/parity/wf03/release-webview-parity.json");console.log(r.text);if(!r.ok)process.exit(1)'
          node --input-type=module -e 'import fs from "node:fs";const a=JSON.parse(fs.readFileSync("artifacts/build/android-webview-release/release-evidence.json")),t=JSON.parse(fs.readFileSync("artifacts/build/android-webview-release/install-evidence.json")),p=JSON.parse(fs.readFileSync("artifacts/parity/wf03/release-webview-parity.json"));if(!a.ok||!t.ok||!p.ok||t.sourceAabSha256!==a.aabSha256||!t.emulatorRuntimeObserved||t.stateSnapshots<8||t.replayScreenshots!==3||t.trustedTouchActions!==3||t.touchScreenshots!==5||!t.homeResumeStatePreserved||!p.checks.every(x=>x.status==="pass")||t.releaseCertified||t.playApproved||t.hardwareCertified)process.exit(1)'
      - name: Upload independent WF03 release package and game evidence (never keys or AAB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talarion-wf03-release-runtime-evidence
          path: |
            artifacts/build/android-webview-release/release-evidence.json
            artifacts/build/android-webview-release/install-evidence.json
            artifacts/run/android-webview-release/
            artifacts/run/android-webview-release-interactive/
            artifacts/parity/wf03/
          if-no-files-found: error
